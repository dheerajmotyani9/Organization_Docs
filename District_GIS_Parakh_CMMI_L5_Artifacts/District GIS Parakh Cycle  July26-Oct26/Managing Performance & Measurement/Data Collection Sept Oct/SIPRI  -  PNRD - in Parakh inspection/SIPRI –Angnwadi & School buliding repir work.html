<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SIPRI – भवन रिपेयर (Working Model)</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe8;--ph:#fffdf9;--ink:#2a2622;--mut:#8a8278;--line:#ddd5c9;--acc:#e8643c;--acc2:#fbe4da;--ok:#2f8f5b;--fill:#f1ece3;--err:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1917;--ph:#262321;--ink:#eee9e1;--mut:#a39b90;--line:#3d3834;--acc:#f0784f;--acc2:#4a2d22;--ok:#4cb680;--fill:#322e2b;--err:#ef7a6c}}
:root[data-theme="dark"]{--bg:#1b1917;--ph:#262321;--ink:#eee9e1;--mut:#a39b90;--line:#3d3834;--acc:#f0784f;--acc2:#4a2d22;--ok:#4cb680;--fill:#322e2b;--err:#ef7a6c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;align-items:center;padding:14px 10px}
.hint{max-width:380px;color:var(--mut);font-size:12.5px;margin:0 0 10px;text-align:center}
#app{width:100%;max-width:380px;height:min(740px,calc(100vh - 80px));min-height:560px;background:var(--ph);border:2px solid var(--ink);border-radius:26px;overflow:hidden;display:flex;flex-direction:column}
.bar{background:var(--acc);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px}
.bar div{flex:1;font-weight:600}.bar small{display:block;font-weight:400;font-size:11px;opacity:.92}
.bar button{background:rgba(255,255,255,.22);color:#fff;border:0;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 2px;color:var(--mut);font:inherit;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs .on{color:var(--acc);border-color:var(--acc);font-weight:600}
.body{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:9px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--fill);color:var(--mut);padding:9px 2px;font:inherit;cursor:pointer}
.seg .on{background:var(--acc);color:#fff;font-weight:600}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;background:var(--ph);color:var(--ink)}
.btn{border:0;border-radius:9px;padding:11px;font:inherit;font-weight:600;background:var(--acc);color:#fff;cursor:pointer;width:100%}
.btn.o{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btns{display:flex;gap:9px;margin-top:6px}
.card{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--fill);cursor:pointer}
.card b{display:block;font-weight:600}.card span{color:var(--mut);font-size:12px}
.badge{display:table;margin:6px 0 3px;font-size:12.5px;font-weight:700;border-radius:14px;padding:4px 12px;background:#d98a1c;color:#fff}
.badge.ok{background:#1f8a4c}.badge.ed{background:#3b6fd4}.badge.in{background:#7a7268}
.banner{border-radius:10px;padding:11px 12px;font-weight:700;font-size:13.5px;color:#fff;background:#d98a1c}
.banner.ok{background:#1f8a4c}.banner.ed{background:#3b6fd4}
.actions{position:sticky;bottom:-12px;margin:auto -12px -12px;padding:10px 12px 12px;background:var(--ph);border-top:1px solid var(--line);display:flex;gap:10px}
.actions .btn{padding:14px;font-size:15px}
.btn.ok{background:#1f8a4c}.btn.ed{background:#3b6fd4}
.lbl{font-weight:600;margin-top:4px}
.map{flex:none;width:100%;position:relative;aspect-ratio:1/1;border:1px dashed var(--mut);border-radius:10px;overflow:hidden;cursor:crosshair;background:repeating-linear-gradient(45deg,var(--fill),var(--fill) 10px,var(--ph) 10px,var(--ph) 20px)}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map em{position:absolute;bottom:4px;left:8px;font-style:normal;font-size:11px;background:var(--ph);padding:1px 6px;border-radius:6px}
.ph2{display:flex;gap:8px;flex-wrap:wrap}
.thumb{width:72px;height:60px;border-radius:8px;background:var(--acc2);border:1px solid var(--line);font-size:9.5px;padding:4px;color:var(--ink);overflow:hidden}
.add{width:72px;height:60px;border:1.5px dashed var(--acc);border-radius:8px;display:grid;place-items:center;color:var(--acc);cursor:pointer;background:none;font:inherit;font-size:12px}
.q{display:flex;justify-content:space-between;align-items:center;gap:8px}.q>span{flex:1}.q select{width:130px;padding:7px}
.yn{display:flex;gap:5px}.yn button{border:1px solid var(--line);background:var(--ph);color:var(--ink);border-radius:12px;padding:4px 12px;cursor:pointer;font:inherit}
.yn .on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chk{display:flex;gap:8px;align-items:center;padding:3px 0;cursor:pointer}
.chk input{width:17px;height:17px;padding:0;accent-color:var(--acc)}
.opts{display:flex;gap:10px}
.opt{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px;border:2px solid var(--ink);border-radius:12px;background:var(--ph);color:var(--ink);font:inherit;font-weight:700;font-size:14px;cursor:pointer;text-align:center}
.opt span{font-size:26px;line-height:1}.opt small{font-weight:400;font-size:11.5px;color:var(--mut)}
.opt.on{background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 0 0 3px var(--acc2)}
.opt.on small{color:#fff;opacity:.95}
.err{color:var(--err);font-size:12.5px}
.stat{display:flex;gap:8px}.stat div{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;background:var(--fill)}.stat b{display:block;font-size:19px}
.ok-ic{width:66px;height:66px;border-radius:50%;border:3px solid var(--ok);color:var(--ok);display:grid;place-items:center;font-size:34px;margin:50px auto 6px}
.c{text-align:center}.mut{color:var(--mut);font-size:12.5px}
.kv{font-size:13px;line-height:1.55}
</style></head><body>
<p class="hint">Working model: koi bhi 10-digit number daalo, OTP <b>123456</b>. Sub Engineer se inspection submit karo, phir logout karke Assistant Engineer se approve / edit karo. (Is session mein data memory mein rehta hai.)</p>
<div id="app"></div>
<script>
const WORKS=["Roof / slab waterproofing","Plastering & painting","Flooring repair","Door / window repair","Electrical wiring","Plumbing & sanitation","Toilet repair","Boundary wall repair","Drinking water facility","Other"];
const AGE=["< 10 years","10–20 years","20–30 years","30+ years"],COND=["Good","Average","Poor","Dangerous"];
const SITES=[
{id:1,n:"Govt. Primary School, Khedi",t:"School",jp:"JP 3"},{id:2,n:"Anganwadi Kendra 112",t:"Anganwadi",jp:"JP 3"},
{id:3,n:"Govt. Middle School, Rampur",t:"School",jp:"JP 5"},{id:4,n:"Anganwadi Kendra 87",t:"Anganwadi",jp:"JP 5"},
{id:5,n:"Govt. High School, Barkhedi",t:"School",jp:"JP 7"},{id:6,n:"Anganwadi Kendra 09",t:"Anganwadi",jp:"JP 7"}];
const db={subs:[],seq:1};
let S={role:"SE",stage:"mobile",mobile:"",screen:"login",tab:"new",filter:"All",f:null,mode:"new",err:"",msg:"",view:null,aeTab:"Pending"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const site=id=>SITES.find(x=>x.id===id);
const blank=id=>({bid:id,pts:[],photos:[],status:"",q:{},works:[],remarks:"",reason:""});
const area=p=>{let a=0;for(let i=0;i<p.length;i++){const j=(i+1)%p.length;a+=p[i][0]*p[j][1]-p[j][0]*p[i][1]}return Math.round(Math.abs(a)/2*0.36)};
const TREES=[[12,30],[14,55],[84,25],[10,12],[70,74],[40,12]];
const BASE=`<rect width="100" height="100" fill="#cddfb5"/><rect x="0" y="80" width="100" height="12" fill="#b9b4aa"/><path d="M0 86H100" stroke="#fff" stroke-width=".6" stroke-dasharray="3 2"/><rect x="88" y="0" width="7" height="80" fill="#c9c4ba"/><rect x="20" y="20" width="60" height="46" fill="#e4ecd3" stroke="#6b7a55" stroke-width=".5" stroke-dasharray="2 1"/><rect x="30" y="30" width="40" height="22" fill="#c4553a" stroke="#7d2f1c" stroke-width=".6"/><rect x="34" y="34" width="32" height="14" fill="#d9775d"/>${TREES.map(t=>`<circle cx="${t[0]}" cy="${t[1]}" r="4" fill="#6f9a52" opacity=".9"/>`).join("")}<text x="50" y="42.5" font-size="3.2" fill="#fff" text-anchor="middle">Building</text><text x="8" y="87.2" font-size="3" fill="#555">Main Road</text><path d="M94 14V4M94 4L92.5 7M94 4L95.5 7" stroke="#333" stroke-width=".7" fill="none"/><text x="94" y="18" font-size="3" text-anchor="middle" fill="#333">N</text><path d="M6 96H22.7" stroke="#333" stroke-width=".8"/><text x="6" y="94.5" font-size="2.8" fill="#333">10 m</text>`;
const poly=(p,close)=>`<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">${BASE}${p.length>1?`<${close&&p.length>2?'polygon':'polyline'} points="${p.map(x=>x.join(",")).join(" ")}" fill="${close?'rgba(232,100,60,.35)':'none'}" stroke="#e8643c" stroke-width="1.1" stroke-linejoin="round"/>`:''}${p.map((x,k)=>`<circle cx="${x[0]}" cy="${x[1]}" r="2.6" fill="${k===p.length-1&&!close?'#2563eb':'#e8643c'}" stroke="#fff" stroke-width=".7"/><text x="${x[0]}" y="${x[1]+1.1}" font-size="3" font-weight="700" fill="#fff" text-anchor="middle">${k+1}</text>`).join("")}</svg>`;
const perim=p=>{let d=0;for(let i=0;i<p.length;i++){const q=p[(i+1)%p.length];if(i<p.length-1||p.length>2)d+=Math.hypot(q[0]-p[i][0],q[1]-p[i][1])}return Math.round(d*0.6)};
const bar=(t,sub,out)=>`<div class="bar"><div>${t}<small>${sub}</small></div>${out?'<button onclick="logout()">Logout</button>':''}</div>`;
const set=o=>{Object.assign(S,o);render()};

function logout(){set({screen:"login",stage:"mobile",mobile:"",f:null,err:"",view:null})}
function sendOtp(){const m=$("mob").value.trim();if(!/^\d{10}$/.test(m))return set({err:"10 digit ka mobile number daalo"});set({mobile:m,stage:"otp",err:""})}
function verify(){if($("otp").value.trim()!=="123456")return set({err:"Galat OTP. Demo OTP: 123456"});set({screen:"home",tab:"new",aeTab:"Pending",err:""})}

function openSite(id){set({screen:"form",mode:"new",f:blank(id),err:""});if(!S.demoDone){S.demoDone=1;setTimeout(autoWalk,500)}}
function mapClick(e){const r=e.currentTarget.getBoundingClientRect();if(S.f.closed)return;S.f.pts.push([+((e.clientX-r.left)/r.width*100).toFixed(1),+((e.clientY-r.top)/r.height*100).toFixed(1)]);render()}
function autoWalk(){const f=S.f;f.pts=[];f.closed=false;render();const P=[[24,24],[50,22],[76,24],[78,44],[76,62],[50,64],[24,62],[22,44]];P.forEach((q,k)=>setTimeout(()=>{if(S.f!==f)return;f.pts.push(q);if(k===P.length-1)f.closed=true;render()},450*(k+1)))}
function undoPt(){S.f.pts.pop();S.f.closed=false;render()}
function closePoly(){if(S.f.pts.length<3)return set({err:"Polygon ke liye kam se kam 3 points chahiye"});S.f.closed=true;set({err:""})}
function addPhoto(){if(S.f.photos.length>=3)return;const j=()=>(Math.random()*0.002).toFixed(5);S.f.photos.push({lat:(23.2599+ +j()).toFixed(5),lng:(77.4126+ +j()).toFixed(5),t:new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})});render()}
function setStatus(v){S.f.status=v;render()}
function setQ(k,v){S.f.q[k]=v;render()}
function togWork(w){const a=S.f.works,i=a.indexOf(w);i<0?a.push(w):a.splice(i,1);render()}
function resetForm(){S.f=blank(S.f.bid);set({err:""})}
function validate(f){
 if(f.pts.length<3||!f.closed)return"Site ka polygon (kam se kam 3 points) banake Close karo";
 if(!f.photos.length)return"Kam se kam 1 geo-tagged photo lo";
 if(!f.status)return"Status select karo";
 if(f.status==="Need Repair"){for(let i=1;i<=5;i++)if(!f.q[i])return"Saare 5 questions ke jawab do";if(!f.works.length)return"Kam se kam 1 repair work chuno"}
 return""}
function submit(){
 const f=S.f,e=validate(f);if(e)return set({err:e});
 if(S.mode==="new"){db.subs.unshift({id:db.seq++,...JSON.parse(JSON.stringify(f)),status2:"Pending",date:new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}),by:"Sub Engineer"});set({screen:"ok",msg:"Data submitted successfully",err:""})}
 else{if(!f.reason.trim())return set({err:"Edit ka reason likhna zaroori hai"});const s=db.subs.find(x=>x.id===S.view);Object.assign(s,JSON.parse(JSON.stringify(f)),{status2:"Edited by AE"});set({screen:"ok",msg:"Edited data submitted & sent to web portal",err:""})}}
function approve(){db.subs.find(x=>x.id===S.view).status2="Approved";set({screen:"ok",msg:"Approved & sent to web portal",err:""})}
function editSub(){const s=db.subs.find(x=>x.id===S.view);set({screen:"form",mode:"edit",f:JSON.parse(JSON.stringify(s)),err:""})}
function badge(s){const c=s==="Approved"?["ok","✓ "]:s==="Edited by AE"?["ed","✎ "]:s==="Pending"?["","⏳ "]:["in","● "];return`<i class="badge ${c[0]}">${c[1]}${s}</i>`}

function loginV(){
 return bar("SIPRI","Government of Madhya Pradesh")+`<div class="body">
 <div class="c" style="color:var(--acc);font-weight:700;font-size:18px;margin:10px 0 2px">Namaste,</div><div class="c mut">Please enter details to login</div>
 <div class="lbl">Login as</div><div class="seg"><button class="${S.role==="SE"?"on":""}" onclick="set({role:'SE',err:''})">Sub Engineer</button><button class="${S.role==="AE"?"on":""}" onclick="set({role:'AE',err:''})">Assistant Engineer</button></div>
 <div class="lbl">Mobile Number</div><input id="mob" inputmode="numeric" maxlength="10" placeholder="Enter Mobile Number" value="${S.mobile}" ${S.stage==="otp"?"readonly":""}>
 ${S.stage==="mobile"?`<button class="btn" onclick="sendOtp()">Send OTP</button>`:`<div class="lbl">Enter OTP</div><input id="otp" inputmode="numeric" maxlength="6" placeholder="6 digit OTP"><button class="btn" onclick="verify()">Verify & Login</button><button class="btn o" onclick="set({stage:'mobile',err:''})">Change number</button>`}
 <div class="err">${S.err}</div></div>`}

function homeSE(){
 const mine=db.subs;
 const tabs=`<div class="tabs"><button class="${S.tab==="new"?"on":""}" onclick="set({tab:'new'})">New Inspection Work</button><button class="${S.tab==="hist"?"on":""}" onclick="set({tab:'hist'})">Inspection History</button></div>`;
 let b;
 if(S.tab==="new"){const l=SITES.filter(x=>S.filter==="All"||x.t===S.filter);
  b=`<div class="mut">Assigned: Bhopal · Block A · JP 3, 5, 7</div><div class="seg">${["All","School","Anganwadi"].map(x=>`<button class="${S.filter===x?"on":""}" onclick="set({filter:'${x}'})">${x}</button>`).join("")}</div>`+
  l.map(x=>{const d=mine.some(m=>m.bid===x.id);return`<div class="card" onclick="openSite(${x.id})"><b>${x.n}${d?badge("Inspected"):""}</b><span>${x.t} · Block A · ${x.jp}</span></div>`}).join("")}
 else b=mine.length?mine.map(m=>`<div class="card" onclick="set({screen:'detail',view:${m.id}})"><b>${site(m.bid).n}${badge(m.status2)}</b><span>${m.status} · ${m.date}</span></div>`).join(""):`<div class="c mut" style="margin-top:50px">Abhi koi inspection submit nahi hua.</div>`;
 return bar("भवन रिपेयर","Sub Engineer · +91 "+S.mobile,1)+tabs+`<div class="body">${b}</div>`}

function formV(){
 const f=S.f,s=site(f.bid),edit=S.mode==="edit";
 const yn=k=>`<div class="yn">${["Yes","No"].map(v=>`<button class="${f.q[k]===v?"on":""}" onclick="setQ(${k},'${v}')">${v}</button>`).join("")}</div>`;
 const sel=(k,a)=>`<select onchange="S.f.q[${k}]=this.value;render()"><option value="">Select</option>${a.map(v=>`<option ${f.q[k]===v?"selected":""}>${v}</option>`).join("")}</select>`;
 return bar(esc(s.n),edit?"Edit inspection (AE)":"New inspection")+`<div class="body">
 <div class="lbl">Site boundary (polygon)</div>
 <div class="mut">Building ke around map pe tap karke corner points lagao (ya Auto-walk dabao), phir polygon close karo.</div>
 <div class="map" onclick="mapClick(event)">${poly(f.pts,f.closed)}<em>${f.pts.length} points · ${perim(f.pts)} m${f.closed?" · ~"+area(f.pts)+" sq m":""}</em></div>
 <div class="btns" style="margin:0"><button class="btn o" onclick="undoPt()">Undo</button><button class="btn o" onclick="autoWalk()">▶ Auto-walk</button><button class="btn" onclick="closePoly()">Close</button></div>
 <div class="lbl">Geo-tagged photo</div>
 <div class="ph2">${f.photos.map((p,i)=>`<div class="thumb">📷 ${i+1}<br>${p.lat}<br>${p.lng}<br>${p.t}</div>`).join("")}${f.photos.length<3?`<button class="add" onclick="addPhoto()">+ Capture</button>`:""}</div>
 <div class="lbl">Status</div>
 <div class="opts"><button class="opt ${f.status==="New Construction"?"on":""}" onclick="setStatus('New Construction')"><span>🏗️</span>New Construction<small>Naya building banana hai</small></button><button class="opt ${f.status==="Need Repair"?"on":""}" onclick="setStatus('Need Repair')"><span>🛠️</span>Need Repair<small>Building pehle se hai</small></button></div>
 ${f.status==="Need Repair"?`
 <div class="q"><span>1. Building repair layak hai?</span>${yn(1)}</div>
 <div class="q"><span>2. Building kitni purani hai?</span>${sel(2,AGE)}</div>
 <div class="q"><span>3. Structural damage hai?</span>${yn(3)}</div>
 <div class="q"><span>4. Current condition?</span>${sel(4,COND)}</div>
 <div class="q"><span>5. Abhi use mein hai?</span>${yn(5)}</div>
 <div class="lbl">Permissible repair works</div>
 ${WORKS.map(w=>`<label class="chk"><input type="checkbox" ${f.works.includes(w)?"checked":""} onchange="togWork('${w}')">${w}</label>`).join("")}`:""}
 <div class="lbl">Remarks</div><textarea rows="2" oninput="S.f.remarks=this.value">${esc(f.remarks)}</textarea>
 ${edit?`<div class="lbl">Reason for edit (required)</div><input value="${esc(f.reason)}" oninput="S.f.reason=this.value">`:""}
 <div class="err">${S.err}</div>
 <div class="btns">${edit?`<button class="btn o" onclick="set({screen:'detail',err:''})">Cancel</button>`:`<button class="btn o" onclick="resetForm()">Reset</button>`}<button class="btn" onclick="submit()">Submit</button></div></div>`}

function detailV(){
 const m=db.subs.find(x=>x.id===S.view),s=site(m.bid),ae=S.role==="AE";
 const back=ae?"set({screen:'home'})":"set({screen:'home',tab:'hist'})";
 return bar(esc(s.n),(ae?"Review work":"Inspection details")+" · "+m.status2)+`<div class="body">
 ${m.status2==="Approved"?`<div class="banner ok">✓ Assistant Engineer ne Approve kiya — web portal pe transfer ho gaya</div>`:m.status2==="Edited by AE"?`<div class="banner ed">✎ Assistant Engineer ne edit karke approve kiya — web portal pe transfer ho gaya</div>`:`<div class="banner">⏳ Pending — Assistant Engineer ke review ka intezaar</div>`}
 <div class="map" style="cursor:default;aspect-ratio:4/3">${poly(m.pts,true)}<em>~${area(m.pts)} sq m</em></div>
 <div class="ph2">${m.photos.map((p,i)=>`<div class="thumb">📷 ${i+1}<br>${p.lat}<br>${p.lng}</div>`).join("")}</div>
 <div class="card kv" style="cursor:default"><b>${m.status}</b>
 ${m.status==="Need Repair"?`Repair layak: ${m.q[1]}<br>Building age: ${m.q[2]}<br>Structural damage: ${m.q[3]}<br>Condition: ${m.q[4]}<br>In use: ${m.q[5]}<br><b style="margin-top:6px">Repair works</b>${m.works.join(", ")}`:"Naya construction required"}
 ${m.remarks?`<br><b style="margin-top:6px">Remarks</b>${esc(m.remarks)}`:""}${m.reason?`<br><b style="margin-top:6px">AE edit reason</b>${esc(m.reason)}`:""}</div>
 <div class="mut">Submitted by ${m.by} · ${m.date}</div>
 ${ae&&m.status2!=="Pending"?`<div class="mut">Record locked — web portal pe transfer ho chuka hai.</div>`:""}
 <button class="btn o" onclick="${back}">Back</button>
 ${ae&&m.status2==="Pending"?`<div class="actions"><button class="btn ed" onclick="editSub()">✎ Edit</button><button class="btn ok" onclick="approve()">✓ Approve</button></div>`:""}</div>`}

function homeAE(){
 const p=db.subs.filter(x=>x.status2==="Pending"),d=db.subs.filter(x=>x.status2!=="Pending"),l=S.aeTab==="Pending"?p:d;
 return bar("भवन रिपेयर","Assistant Engineer · +91 "+S.mobile,1)+
 `<div class="tabs"><button class="${S.aeTab==="Pending"?"on":""}" onclick="set({aeTab:'Pending'})">Pending (${p.length})</button><button class="${S.aeTab==="Reviewed"?"on":""}" onclick="set({aeTab:'Reviewed'})">Reviewed (${d.length})</button></div>
 <div class="body"><div class="stat"><div><b>${db.subs.length}</b>Total</div><div><b>${p.length}</b>Pending</div><div><b>${d.length}</b>Sent to portal</div></div>`+
 (l.length?l.map(m=>`<div class="card" onclick="set({screen:'detail',view:${m.id}})"><b>${site(m.bid).n}${badge(m.status2)}</b><span>${m.status} · ${m.date}</span></div>`).join(""):`<div class="c mut" style="margin-top:40px">${S.aeTab==="Pending"?"Koi pending work nahi. Pehle Sub Engineer se inspection submit karo.":"Abhi koi reviewed work nahi."}</div>`)+`</div>`}

function okV(){
 const ae=S.role==="AE";
 return bar("भवन रिपेयर",ae?"Assistant Engineer":"Sub Engineer")+`<div class="body c"><div class="ok-ic">✓</div><b style="font-size:16px">${S.msg}</b>
 <div class="mut">${ae?"":"Record Inspection History mein add ho gaya."}</div>
 <button class="btn" style="margin-top:16px" onclick="set({screen:'home',tab:'${ae?"new":"new"}',err:''})">${ae?"Back to list":"New Inspection"}</button>
 ${ae?"":`<button class="btn o" onclick="set({screen:'home',tab:'hist'})">View History</button>`}</div>`}

function render(){
 const v=S.screen==="login"?loginV():S.screen==="home"?(S.role==="SE"?homeSE():homeAE()):S.screen==="form"?formV():S.screen==="detail"?detailV():okV();
 const top=document.querySelector(".body"),y=top?top.scrollTop:0;
 $("app").innerHTML=v;
 const nb=document.querySelector(".body");if(nb&&["form","home"].includes(S.screen))nb.scrollTop=y;
}
render();
</script></body></html>
