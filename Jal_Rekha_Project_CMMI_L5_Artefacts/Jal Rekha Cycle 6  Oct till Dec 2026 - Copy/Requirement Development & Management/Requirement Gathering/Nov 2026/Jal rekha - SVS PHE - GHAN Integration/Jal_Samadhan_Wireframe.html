<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jal Samadhan – Interactive Wireframe (Jal Rekha)</title>
<style>
:root{--o:#ff6b1f;--g:#c9a94a;--b:#2563d8;--ok:#00c46a;--bg:#eef0f6;--t:#1d1d1f}
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Roboto,Arial,sans-serif;background:#2b2f3a;color:var(--t);display:flex;height:100vh}
#side{width:270px;background:#1b1e27;color:#ddd;padding:12px;overflow:auto;flex:none}
#side h1{font-size:15px;color:#fff;margin:0 0 4px}#side small{color:#8b90a0}
#side h2{font-size:11px;letter-spacing:1px;color:var(--g);margin:14px 0 4px;text-transform:uppercase}
#side a{display:block;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:13px}
#side a:hover{background:#2c3040}#side a.on{background:var(--o);color:#fff}
#side button{width:100%;margin-top:8px;padding:8px;border:0;border-radius:6px;background:var(--b);color:#fff;cursor:pointer}
#side button.alt{background:#444a5c}#side button.ed{background:var(--g);color:#222}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;overflow:auto;padding:16px}
#note{color:#aab;font-size:12px;margin-bottom:8px;text-align:center;max-width:420px}
.phone{width:360px;height:720px;background:var(--bg);border:10px solid #111;border-radius:30px;position:relative;overflow:hidden;display:flex;flex-direction:column;flex:none}
.web{width:100%;max-width:980px;height:720px;border-radius:10px;border:none}
.bar{background:var(--o);color:#fff;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600;flex:none}
.bar .sp{flex:1}.bar i{font-style:normal;cursor:pointer}
.body{flex:1;overflow:auto;padding:12px}
.card{background:#fff;border-radius:10px;padding:10px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
.btn{display:block;width:100%;text-align:center;padding:11px;border-radius:22px;background:var(--b);color:#fff;margin:10px 0;cursor:pointer;border:0;font-size:14px}
.btn.g{background:var(--g)}.btn.o{background:var(--o)}.btn.s{width:auto;display:inline-block;padding:6px 12px;margin:2px;font-size:12px}
.in{background:#fff;border-radius:8px;padding:11px;margin:4px 0 10px;color:#666;border:1px solid #ddd;font-size:14px}
label{font-size:13px;font-weight:600}label b{color:red}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:#fff;border-radius:10px;padding:14px 6px;text-align:center;font-size:13px;cursor:pointer;box-shadow:0 1px 3px #0002}
.tile .ic{font-size:34px}
.stat{text-align:center;font-size:11px}.ring{width:54px;height:54px;border-radius:50%;border:6px solid;margin:6px auto 0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.row{background:#fff;border-radius:8px;padding:9px;margin-bottom:8px;font-size:13px;position:relative}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:#eee;margin:3px 3px 0 0}
.tag.y{background:#fff3b0}.tag.gr{background:#c8f5dc}.tag.r{background:#ffd3d3}.tag.bl{background:#d6e4ff}
.map{height:170px;border-radius:8px;background:linear-gradient(135deg,#6f8f6a,#4c6b59);position:relative;overflow:hidden;color:#fff;font-size:11px}
.map svg{position:absolute;inset:0}.map span{position:absolute;left:8px;bottom:6px;background:#0008;padding:2px 6px;border-radius:4px}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs div{flex:1;text-align:center;padding:7px;border-radius:8px;background:#dfe3ee;font-size:12px;cursor:pointer}.tabs .on{background:var(--b);color:#fff}
.modal{position:absolute;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:5}
.modal.show{display:flex}.modal div{background:#fff;border-radius:14px;padding:18px;width:80%}
.modal h3{margin:0 0 8px}.bars div{height:14px;background:var(--b);border-radius:3px;margin:3px 0}
table{width:100%;border-collapse:collapse;font-size:12px;background:#fff}th{background:#0b2a5b;color:#fff;padding:7px;text-align:left}td{padding:7px;border-bottom:1px solid #eee}
.edit .phone *:not(.modal):not(.modal *){}
.edit [contenteditable]{outline:1px dashed #2563d8;outline-offset:1px}
.del{position:absolute;right:4px;top:4px;background:#e33;color:#fff;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-size:12px;cursor:pointer;display:none}
.edit .del{display:block}.edit .add{display:block}.add{display:none}
.note{font-size:11px;color:#a60;background:#fff6dd;border-left:3px solid var(--g);padding:5px 7px;margin:6px 0;border-radius:4px}
</style></head><body>
<div id="side">
 <h1>Jal Samadhan</h1><small>Jal Rekha · Grievance module wireframe<br>Asset: Water Pipeline (replaces Road)</small>
 <div id="nav"></div>
 <button class="ed" id="bEdit">✎ Edit mode: OFF</button>
 <button id="bSave">⬇ Save edited copy (.html)</button>
 <button class="alt" id="bPrint">Print / PDF all screens</button>
</div>
<div id="stage"><div id="note"></div><div id="view"></div></div>
<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const hdr=(t,back)=>`<div class="bar">${back?`<i data-go="${back}">←</i>`:''}<span>${t}</span></div>`;
const map=(txt)=>`<div class="map"><svg viewBox="0 0 300 170"><path d="M10 150 C80 60 120 140 180 80 S260 40 290 20" stroke="#27c4ff" stroke-width="5" fill="none"/><path d="M10 150 C80 60 120 140 180 80 S260 40 290 20" stroke="#27c4ff55" stroke-width="22" fill="none"/><circle cx="170" cy="86" r="7" fill="#e33"/></svg><span>${txt}</span></div>`;
const tiles=(a)=>`<div class="grid">${a.map(x=>`<div class="tile" data-go="${x[2]}"><div class="ic">${x[0]}</div>${x[1]}</div>`).join('')}</div>`;
const stats=(a)=>`<div class="grid" style="grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:10px">${a.map(x=>`<div class="card stat">${x[0]}<div class="ring" style="border-color:${x[2]}">${x[1]}</div></div>`).join('')}</div>`;
const cRow=(id,t,tags)=>`<div class="row"><span class="del">×</span><b>${id}</b> – ${t}<br>${tags}</div>`;

const S=[
{g:'Citizen',id:'landing',t:'1. Landing / User type',n:'Citizen → mobile OTP login. Department → username/password + OTP.',h:()=>`<div class="body" style="text-align:center"><h2>-- जल समाधान --</h2><div class="grid"><div class="card">👤<br>Dr. Mohan Yadav<br><small>माननीय मुख्यमंत्री जी</small></div><div class="card">👤<br>Minister<br><small>माननीय मंत्री जी (PHE / Jal Shakti)</small></div></div><div class="grid" style="margin-top:20px"><div class="tile" data-go="c_login"><div class="ic">👥</div>Citizen</div><div class="tile" data-go="d_login"><div class="ic">🏛</div>Department</div></div><p style="font-size:12px">इस एप के माध्यम से आप जल पाइपलाइन की शिकायत / जानकारी उक्त स्थान का फोटो लेकर दे सकते हैं। (शिकायत दर्ज करने के लिए Citizen पर क्लिक करें)</p></div>`},
{g:'Citizen',id:'c_login',t:'2. Citizen – Register / Login (OTP)',n:'Register on first use; same flow for returning users.',h:()=>`<div class="body"><p style="text-align:center;font-size:50px">🔒💧</p><label>अपना मोबाइल नंबर दर्ज करें <b>*</b></label><div class="in">+91 | मोबाइल नंबर</div><label>OTP <b>*</b></label><div class="in">• • • • • •</div><div class="btn" data-go="c_dash">ओटीपी भेजें / सत्यापित करें और लॉगिन करें</div><small style="color:#777">New user? Name, district &amp; mobile captured on first login (Register).</small></div>`},
{g:'Citizen',id:'c_dash',t:'3. Citizen Dashboard',n:'Counts: Assigned / Pending / Solved.',h:()=>hdr('डैशबोर्ड (जल समाधान)')+`<div class="body">${stats([['कुल शिकायतें',0,'#b59a3a'],['लंबित शिकायतें',0,'#ffbf8c'],['हल की गई',0,'#00d26a']])}${tiles([['📝','शिकायत / जानकारी दर्ज करें','c_reg'],['🚰','जल पाइपलाइन सूची<br><small>List of Water Pipelines Asset</small>','c_list'],['🔍','सभी शिकायतें देखें (0)','c_all'],['🗺','पाइपलाइन मैप / बफर','c_map']])}<div class="card" style="margin-top:10px">Bhopal · 30° C · Sunny</div></div>`},
{g:'Citizen',id:'c_reg',t:'4. Register Complaint / Information',n:'Toggle shows both validation states: pipeline registered vs not registered.',h:()=>hdr('Register Complaint','c_dash')+`<div class="body"><label>Select your location</label>${map('Lat 23.243, Long 77.430 · Accuracy 3.5 m')}<div class="tabs" style="margin-top:8px"><div class="on" id="tOk">Pipeline registered</div><div id="tNo">Not registered</div></div><div id="vOk"><div class="note">✔ चयनित पाइपलाइन में मरम्मत की जा सकती है। कृपया लीकेज / टूटी पाइपलाइन / गंदा पानी की फोटो अपलोड करें।</div><div class="in" style="height:80px;text-align:center">📷 फ़ोटो लेने के लिए यहाँ क्लिक करें</div><label>Complaint type</label><div class="in">Leakage ▾ (Leakage / Burst / No supply / Contamination / Low pressure)</div><div class="in" style="height:70px">कृपया यहां अपनी शिकायत दर्ज करें…</div><div class="btn" id="sub">Submit Complaint</div></div><div id="vNo" style="display:none"><div class="note" style="background:#ffe9e9;border-color:#e33">⚠ वर्तमान में इस पाइपलाइन की शिकायत इस एप के माध्यम से नहीं की जा सकती। यह पाइपलाइन एप में रजिस्टर्ड नहीं है। (रजिस्टर्ड पाइपलाइन असेट्स की जिलावार सूची देखने के लिए "पाइपलाइन सूची" पर क्लिक करें)</div><div class="btn">लोकेशन रिफ्रेश करें</div><div class="btn g" data-go="c_list">पाइपलाइन सूची</div></div></div><div class="modal" id="m1"><div><h3>Success</h3>Complaint registered and forwarded to L-1 Officer successfully.<br><br><span class="btn s o" id="mok">OK</span></div></div>`,after:()=>{$('#tNo').onclick=()=>{$('#vOk').style.display='none';$('#vNo').style.display='';$('#tNo').className='on';$('#tOk').className=''};$('#tOk').onclick=()=>{$('#vNo').style.display='none';$('#vOk').style.display='';$('#tOk').className='on';$('#tNo').className=''};$('#sub').onclick=()=>$('#m1').classList.add('show');$('#mok').onclick=()=>go('c_all')}},
{g:'Citizen',id:'c_list',t:'5. List of Water Pipelines Asset',n:'Replaces "सड़क की सूची". Filter by Department + District; View on Map opens pipeline route.',h:()=>hdr('जल पाइपलाइन असेट सूची','c_dash')+`<div class="body"><div class="grid"><div class="in">PHE ▾</div><div class="in">District ▾ (Tikamgarh)</div></div><div class="in">यहाँ सर्च करें…</div><div id="rows">${[['Ajnour–Dunda Rising Main','11.40 KM'],['Aparwal Distribution Line','900 M'],['Arora WTP Feeder Main','490 M'],['Bagaaj OHT Supply Line','1.33 KM']].map((r,i)=>`<div class="row"><span class="del">×</span><b>${i+1}. ${r[0]}</b><br><span class="tag" data-go="c_pmap">📍 VIEW ON MAP</span><span class="tag">PHE</span><span class="tag y">${r[1]}</span><span class="tag bl">Dia: 150 mm · DI</span></div>`).join('')}</div><div class="btn s g add" id="addRow">+ Add row</div></div>`,after:()=>{$('#addRow').onclick=()=>{const r=$('#rows .row').cloneNode(true);$('#rows').appendChild(r);ed(r)}}},
{g:'Citizen',id:'c_pmap',t:'6. Pipeline on Map (Route + Buffer)',n:'Pipeline route polyline with configurable buffer (e.g. 10 m) – complaints are accepted only inside the buffer.',h:()=>hdr('Pipeline: Ajnour–Dunda Rising Main','c_list')+`<div class="body">${map('Route + buffer zone (blue band)')}<div class="card" style="margin-top:8px">Pipeline length: <b>11.40 KM</b><br>Buffer: <b>10 m</b> either side<br>Material / Dia: DI · 150 mm<br>Scheme: Jal Jeevan / O&amp;M</div><div class="btn" data-go="c_reg">Register complaint here</div></div>`},
{g:'Citizen',id:'c_all',t:'7. View All Complaints',n:'Status: Submitted → L1 → L2 → L3 → Resolved.',h:()=>hdr('सभी शिकायतें','c_dash')+`<div class="body"><div class="tabs"><div class="on">All</div><div>Pending</div><div>Resolved</div></div>${cRow('JS-1001','Leakage – Ajnour–Dunda Rising Main','<span class="tag y">With L1 (SE)</span><span class="tag">05 Nov 2026</span>')}${cRow('JS-0998','No supply – Aparwal line','<span class="tag bl">Assigned to Contractor (L0)</span><span class="tag">Due in 5 days</span>')}${cRow('JS-0987','Burst pipe – Arora feeder','<span class="tag gr">Resolved · Verified by L2</span>')}</div>`},
{g:'Department',id:'d_login',t:'8. Department Login',n:'Mobile/username + password + OTP + captcha. Role decides the dashboard.',h:()=>`<div class="body"><p style="text-align:center;font-size:50px">🔒💧</p><label>मोबाइल नंबर या यूजरनेम <b>*</b></label><div class="in">L1 user</div><label>पासवर्ड <b>*</b></label><div class="in">••••••••  👁</div><label>OTP <b>*</b></label><div class="in">• • • • • •</div><div class="grid"><div class="in" style="letter-spacing:3px">852930</div><div class="in">कैप्चा दर्ज करें</div></div><div class="note">Demo: jump to a role →</div><span class="btn s" data-go="l1">L1 SE</span><span class="btn s" data-go="l2">L2 AE</span><span class="btn s" data-go="l3">L3 EE (web)</span></div>`},
{g:'Department',id:'l1',t:'9. L1 – SE Dashboard (Mobile)',n:'Citizen complaints land here. SE assigns to Contractor (L0), 7 working days. Resolved items are verified by L2.',h:()=>hdr('डैशबोर्ड – L1 (SE)')+`<div class="body">${stats([['नई',3,'#b59a3a'],['Assigned to L0',5,'#ffbf8c'],['हल की गई',12,'#00d26a']])}<div class="tabs"><div class="on">New</div><div>With Contractor</div><div>Resolved</div></div>${cRow('JS-1001','Leakage – Ajnour–Dunda Rising Main','<span class="tag y">New</span><span class="tag bl" data-go="cd">Assign →</span>')}${cRow('JS-1002','Contamination – Aparwal line','<span class="tag y">New</span><span class="tag bl" data-go="cd">Assign →</span>')}<div class="note">Not resolved in 7 working days → auto-escalates to L2 (AE).</div></div>`},
{g:'Department',id:'cd',t:'10. Complaint Detail – Assign / Resolve',n:'On resolve: photo + remark are mandatory.',h:()=>hdr('Complaint JS-1001','l1')+`<div class="body"><div class="card"><b>Leakage</b> · Ajnour–Dunda Rising Main<br>Raised: 05 Nov 2026 01:12 PM<br>Due: 16 Nov 2026 (7 working days)</div>${map('Citizen photo + geotag')}<label style="display:block;margin-top:8px">Assign to Contractor (L0)</label><div class="in">Select contractor ▾</div><div class="btn" data-go="l1">Assign</div><hr><label>Resolution – photo <b>*</b></label><div class="in" style="height:60px;text-align:center">📷 Capture after-repair photo</div><label>Remark <b>*</b></label><div class="in" style="height:60px">Remark…</div><div class="btn g" data-go="l1">Mark Resolved</div></div>`},
{g:'Department',id:'l2',t:'11. L2 – AE Dashboard (Mobile)',n:'Verifies L1-resolved complaints; sees escalated (unresolved) ones. Unresolved here → L3.',h:()=>hdr('डैशबोर्ड – L2 (AE)')+`<div class="body">${stats([['Verify',4,'#b59a3a'],['Escalated',2,'#ff8c8c'],['Closed',20,'#00d26a']])}<div class="tabs"><div class="on">To verify</div><div>Escalated</div></div>${cRow('JS-0987','Burst pipe – Arora feeder','<span class="tag gr">Resolved by L1</span><span class="tag bl" data-go="cd">Verify →</span>')}${cRow('JS-0950','No supply – Bagaaj OHT line','<span class="tag r">Escalated from L1 · 9 days</span>')}</div>`},
{g:'Department',id:'l3',t:'12. L3 – EE Dashboard (Web + Mobile, monitor only)',n:'Read-only monitoring: totals, district-wise load, progress, pipeline map.',h:()=>`<div style="display:flex;flex-direction:column;height:100%"><div class="bar"><span>जल समाधान – L3 (EE) Monitoring</span><span class="sp"></span><small>Web view</small></div><div class="body"><div class="grid" style="grid-template-columns:repeat(4,1fr)"><div class="card stat">Total<div class="ring" style="border-color:#b59a3a">248</div></div><div class="card stat">Pending<div class="ring" style="border-color:#ffbf8c">61</div></div><div class="card stat">Escalated<div class="ring" style="border-color:#ff8c8c">14</div></div><div class="card stat">Resolved<div class="ring" style="border-color:#00d26a">173</div></div></div><div class="grid"><div class="card"><b>District-wise complaints</b><div class="bars">${[['Bhopal',90],['Indore',70],['Tikamgarh',55],['Sagar',40],['Rewa',25]].map(d=>`<div style="width:${d[1]}%;color:#fff;font-size:10px;padding-left:4px">${d[0]}</div>`).join('')}</div><small>Highest: Bhopal</small></div><div class="card"><b>Pipeline map</b>${map('Pipelines + complaint heat')}</div></div><table><tr><th>Complaint</th><th>District</th><th>Level</th><th>Status</th><th>Days</th></tr><tr><td>JS-1001</td><td>Tikamgarh</td><td>L1</td><td>Pending</td><td>0</td></tr><tr><td>JS-0950</td><td>Sagar</td><td>L2</td><td>Escalated</td><td>9</td></tr><tr><td>JS-0987</td><td>Bhopal</td><td>L2</td><td>Resolved</td><td>4</td></tr></table></div></div>`,web:1}
];
let cur='landing',edit=false;
function nav(){let h='',g='';S.forEach(s=>{if(s.g!==g){g=s.g;h+=`<h2>${g} flow</h2>`}h+=`<a data-id="${s.id}" class="${s.id===cur?'on':''}">${s.t}</a>`});$('#nav').innerHTML=h;$$('#nav a').forEach(a=>a.onclick=()=>go(a.dataset.id))}
function ed(root){$$('*',root).forEach(e=>{if(!e.children.length&&e.textContent.trim()&&!e.classList.contains('del')){e.contentEditable=edit}});}
function go(id){cur=id;const s=S.find(x=>x.id===id);$('#view').innerHTML=`<div class="phone ${s.web?'web':''}">${s.h()}</div>`;$('#note').textContent=s.t+' — '+s.n;$$('[data-go]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();if(!edit)go(e.dataset.go)});$$('.del').forEach(d=>d.onclick=()=>d.parentElement.remove());s.after&&s.after();if(edit)ed($('#view'));nav()}
$('#bEdit').onclick=()=>{edit=!edit;document.body.classList.toggle('edit',edit);$('#bEdit').textContent='✎ Edit mode: '+(edit?'ON (click text to edit)':'OFF');$$('#view *').forEach(e=>{if(e.contentEditable==='true'||edit)e.removeAttribute('contenteditable')});if(edit)ed($('#view'))}
$('#bSave').onclick=()=>{const was=edit;if(was)$('#bEdit').click();const html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='Jal_Samadhan_Wireframe_edited.html';a.click()}
$('#bPrint').onclick=()=>{const v=$('#view');const old=v.innerHTML;let all='';S.forEach(s=>{all+=`<div style="display:inline-block;margin:8px;vertical-align:top"><b style="color:#fff">${s.t}</b><div class="phone ${s.web?'web':''}">${s.h()}</div></div>`});$('#stage').style.cssText='display:block';v.innerHTML=all;$('#note').textContent='Use browser Print → Save as PDF. Reload to return.';setTimeout(()=>window.print(),300)}
go('landing');
</script></body></html>
